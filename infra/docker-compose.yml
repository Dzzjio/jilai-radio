# Radio Aha infrastructure. Every image here is available for linux/arm64.
#   Local dev:  docker compose up -d icecast liquidsoap postgres   (api + web run via `pnpm dev`)
#   Production: COMPOSE_PROFILES=prod in infra/.env, then `docker compose up -d --build`
#               adds the API container and Caddy (HTTPS) on ports 80/443. See README.

name: radio-jil

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-radio}
    ports:
      # Localhost only. 5433 by default to avoid clashing with a host Postgres.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  icecast:
    build: ./icecast
    image: radio-jil-icecast
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set ICECAST_SOURCE_PASSWORD in infra/.env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?set ICECAST_ADMIN_PASSWORD in infra/.env}
      ICECAST_HOSTNAME: ${PUBLIC_HOST:-localhost}
      ICECAST_MAX_LISTENERS: ${ICECAST_MAX_LISTENERS:-500}
    ports:
      # Bound to localhost only; in production the public reaches it through Caddy.
      - "127.0.0.1:${ICECAST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/stats.xsl"]
      interval: 10s
      timeout: 3s
      retries: 5

  liquidsoap:
    image: savonet/liquidsoap:v2.4.6
    restart: unless-stopped
    command: ["/radio/radio.liq"]
    # Same user as the API container, so both can read/move/delete live recordings.
    user: "1000:1000"
    depends_on:
      icecast:
        condition: service_healthy
    environment:
      API_URL: ${LIQUIDSOAP_API_URL:-http://api:4000}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET in infra/.env}
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_MOUNT: live
      STATION_NAME: ${STATION_NAME:-Radio Aha}
      STATION_DESCRIPTION: ${STATION_DESCRIPTION:-24/7 online radio}
      STATION_GENRE: ${STATION_GENRE:-Various}
      STATION_URL: ${STATION_URL:-http://localhost:3000}
      STREAM_BITRATE: ${STREAM_BITRATE:-128}
      CROSSFADE_SECONDS: ${CROSSFADE_SECONDS:-5.}
      # Running as uid 1000 has no home dir; give Liquidsoap a writable one for its script cache.
      HOME: /tmp
      # Live input: fed by the API when the admin presses GO LIVE (any Icecast source client works too)
      LIVE_PASSWORD: ${LIVE_PASSWORD:-}
      LIVE_PORT: "8005"
      LIVE_MOUNT: live-in
      RECORDINGS_DIR: /recordings
    ports:
      # Localhost only. The admin's "Go live" reaches it through the API on the Docker network,
      # so this port never needs to be open to the internet.
      - "${LIVE_BIND:-127.0.0.1}:${LIVE_PORT:-8005}:8005"
    volumes:
      - ./liquidsoap:/radio:ro
      - ./fallback:/fallback:ro
      - ${MUSIC_HOST_DIR:-./music}:/music:ro
      - ${RECORDINGS_HOST_DIR:-./recordings}:/recordings
    extra_hosts:
      # Lets Liquidsoap reach an API running on the host during local dev.
      - "host.docker.internal:host-gateway"

  # ---------------- production only (profile "prod") ----------------

  api:
    profiles: ["prod"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: radio-jil-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      icecast:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Use a URL-safe POSTGRES_PASSWORD (e.g. openssl rand -hex 24): it is placed in this URL as-is.
      DATABASE_URL: postgres://${POSTGRES_USER:-radio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radio}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      ICECAST_URL: http://icecast:8000
      ICECAST_MOUNT: /live
      LIQUIDSOAP_MUSIC_DIR: /music
      MUSIC_DIR: /music
      RECORDINGS_DIR: /recordings
      LIQUIDSOAP_RECORDINGS_DIR: /recordings
      MEDIA_DIR: /media
      # "Go live" in admin: the API streams the browser's mic into Liquidsoap's live input.
      LIVE_HOST: liquidsoap
      LIVE_PORT: "8005"
      LIVE_MOUNT: live-in
      LIVE_PASSWORD: ${LIVE_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # The API refuses to start if these are missing or too short.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
    volumes:
      # Same folder Liquidsoap plays from; the API writes uploads here (container user uid 1000).
      - ${MUSIC_HOST_DIR:-./music}:/music
      # Live recordings land here first; the API moves finished ones into /music.
      - ${RECORDINGS_HOST_DIR:-./recordings}:/recordings
      # The site background the admin uploads (video/photo), served at /media.
      - ${MEDIA_HOST_DIR:-./media}:/media

  caddy:
    profiles: ["prod"]
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST (your API domain) in infra/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
